name: nightly

# Unsigned extension build: no release, no store upload. Mirrors the main
# repository's nightly-build contract, which keeps the team on the current
# develop without turning a nightly into an official artefact.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack the extension
        run: |
          cd dist
          zip -qr "../myne-clipper-${GITHUB_SHA}.zip" .
          cd ..
          unzip -l "myne-clipper-${GITHUB_SHA}.zip" | grep -q "manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myne-clipper-${{ github.sha }}
          path: myne-clipper-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
